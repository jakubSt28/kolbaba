name: Idea or feature request
description: Something Kolbaba could do, or do better.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The situation and what gets in your way today. This matters more than the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you imagine it working, in the app or for an AI agent over MCP.
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: How other email apps handle it, screenshots, links.
