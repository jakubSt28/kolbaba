# Checks every pull request and push in the public repository: types, lint and the unit tests, plus the
# tests that need Postgres. (The maintainer's private working repository runs the same checks locally.)
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    if: github.repository != 'jakubSt28/email-client'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kolbaba
          POSTGRES_PASSWORD: kolbaba
          POSTGRES_DB: kolbaba_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kolbaba" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://kolbaba:kolbaba@localhost:5432/kolbaba_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/migrate.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
