# A tag like v1.4.2 publishes the self-hosted image: ghcr.io/jakubst28/kolbaba:1.4.2, :1.4, :1 and :latest.
# Servers on the default :1 install it the next night. See selfhost/README.md.
name: Self-hosted image

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    # Only the maintainer's working repository publishes the image; forks and the public mirror skip this.
    if: github.repository == 'jakubSt28/email-client'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/jakubst28/kolbaba
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          # The image points at the public source code, not at the repository that built it.
          labels: |
            org.opencontainers.image.title=Kolbaba
            org.opencontainers.image.description=Email app for you and your AI agent, for your own server.
            org.opencontainers.image.url=https://kolbaba.app
            org.opencontainers.image.source=https://github.com/jakubSt28/kolbaba
            org.opencontainers.image.licenses=AGPL-3.0-or-later
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.selfhost
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
