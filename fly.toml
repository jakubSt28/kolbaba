# Fly.io config for the sync worker of the hosted app (CONTRIBUTING.md). Secrets are set with `fly secrets set`.
app = "kolbaba-worker"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile.worker"

[env]
  NEXT_PUBLIC_DATA_MODE = "live"
  APP_URL = "https://app.kolbaba.app"
  VAPID_SUBJECT = "mailto:hello@kolbaba.app"
  PORT = "3001"

# Always on: the worker holds IMAP IDLE connections and sends scheduled mail, so it must never sleep.
[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
